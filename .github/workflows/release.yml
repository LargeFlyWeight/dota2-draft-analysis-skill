name: Build skill zip on release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Zip the skill folder
        run: zip -r dota-draft.zip dota-draft
      - name: Attach zip to the release
        uses: softprops/action-gh-release@v2
        with:
          files: dota-draft.zip
